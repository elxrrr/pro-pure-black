<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Configure Pro Pure Black for VirtualDJ: toolbar controls, colour presets and custom deck colours.">
  <title>Pro Pure Black · Skin builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23CC98E5' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23CC98E5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="previews.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main aria-label="Pro Pure Black skin builder">
    <section class="panel presets-panel" aria-labelledby="presets-title">
      <div class="panel-heading">
        <h1 id="presets-title">Colour presets</h1>
        <span id="preset-count" class="count-badge">7 included</span>
      </div>
      <div class="preview-heading"><span id="preview-title">Default</span></div>
      <div id="preset-preview"></div>
      <div class="preset-tools">
        <div class="text-actions"><button id="select-all" type="button">All</button><span aria-hidden="true">/</span><button id="select-default" type="button">Default only</button></div>
      </div>
      <div class="preset-grid" id="presets" aria-label="Included colour presets"></div>
    </section>

    <section class="panel custom-panel" aria-labelledby="custom-title">
      <div class="panel-heading"><h2 id="custom-title">Custom presets</h2><button id="add-custom" class="add-button" type="button"><span aria-hidden="true">+</span> Add preset</button></div>
      <div id="custom-preview-heading" class="preview-heading" hidden><h3 id="custom-preview-title"></h3></div>
      <div id="custom-preview" hidden></div>
      <div id="custom-presets"></div>
    </section>

    <section class="panel toolbar-panel" aria-labelledby="toolbar-title">
      <div class="panel-heading"><h2 id="toolbar-title">Toolbar</h2><span id="toolbar-count" class="count-badge">2 visible</span></div>
      <div id="toolbar-preview"></div>
      <p class="toolbar-order-hint" id="toolbar-order-hint">Left to right. Drag to reorder, or use the arrows.</p>
      <ol id="toolbar-order" class="toolbar-order" aria-label="Toolbar button order" aria-describedby="toolbar-order-hint"></ol>
      <p id="toolbar-order-status" class="sr-only" role="status" aria-live="polite"></p>
    </section>

    <div class="download-panel">
      <div class="download-copy"><strong id="download-summary">7 palettes · 0 optional controls</strong><p>Copy the ZIP into <span>Skins</span>. Select <span>Pro Pure Black Custom</span>, then <span>Layout → Deck Colours</span>.</p></div>
      <button id="download" class="download-button" type="button" disabled><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg><span>Download skin</span></button>
    </div>
    <div class="status-row" hidden><p id="status" role="status" aria-live="polite" hidden></p><button id="retry" type="button" class="text-button" hidden>Try again</button></div>
    <noscript><p class="noscript">Enable JavaScript to configure and download a skin.</p></noscript>
  </main>

  <footer>
    <nav aria-label="Project links"><a href="https://github.com/elxrrr/pro-pure-black" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a><a href="https://github.com/elxrrr/pro-pure-black/releases/latest">Original skin <span aria-hidden="true">↗</span></a></nav>
    <span>Made with AI</span>
  </footer>
</body>
</html>
