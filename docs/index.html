<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Configure Pro Pure Black for VirtualDJ: toolbar controls, colour presets and custom deck colours.">
  <title>Pro Pure Black · Skin builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23CC98E5' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23CC98E5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=23c20fa1f42d">
  <link rel="stylesheet" href="previews.css">
  <script type="module" src="app.js?v=597d8c21ea35"></script>
</head>
<body>
  <main aria-label="Pro Pure Black skin builder">
    <section class="panel overall-preview" aria-labelledby="preview-title">
      <div class="panel-heading">
        <h1 id="preview-title">Preview</h1>
        <div class="toolbar-preview-controls">
          <button type="button" id="toolbar-notch-preview" class="preview-toggle toolbar-notch-toggle" aria-pressed="true">Notch</button>
          <div class="custom-logo-controls">
            <button type="button" id="logo-tint" class="preview-toggle logo-tint-toggle" aria-pressed="true">Tint</button>
            <label class="custom-logo-picker" title="Transparent PNG · 5 MB max · 144 × 34 px"><span>Add Logo...</span><input id="custom-logo-upload" type="file" accept=".png" aria-label="Add Logo..." aria-describedby="custom-logo-hint custom-logo-status" title="Transparent PNG · 5 MB max · 144 × 34 px"></label>
            <button id="custom-logo-remove" type="button" disabled>Remove</button>
            <span id="custom-logo-hint" class="sr-only">Transparent PNG · 5 MB max · 144 × 34 px</span>
          </div>
        </div>
      </div>
      <p id="custom-logo-status" role="status" aria-live="polite" hidden></p>
      <div class="preview-window" role="group" aria-label="Skin preview">
        <div id="toolbar-preview"></div>
        <div id="preset-preview"></div>
      </div>
      <div class="toolbar-preview-notes"><p id="toolbar-fit-status" role="status" aria-live="polite" hidden></p></div>
    </section>

    <section class="panel presets-panel" aria-labelledby="presets-title">
      <div class="panel-heading">
        <h2 id="presets-title">Colour presets</h2>
        <div class="preset-tools">
          <span id="preset-count" class="count-badge">1 included</span>
          <div class="text-actions"><button id="select-all" type="button">All</button><span aria-hidden="true">/</span><button id="select-default" type="button">Default only</button></div>
        </div>
      </div>
      <div class="palette-groups" id="presets" aria-label="Included colour presets"></div>
    </section>

    <div class="configuration-panels">
      <section class="panel custom-panel" aria-labelledby="custom-title">
        <div class="panel-heading"><h2 id="custom-title">Custom presets</h2></div>
        <div id="custom-presets" aria-label="Custom palette editor"></div>
      </section>

      <section class="panel toolbar-panel" aria-labelledby="toolbar-title">
        <div class="panel-heading"><h2 id="toolbar-title">Toolbar</h2><span id="toolbar-count" class="count-badge">4 included</span></div>
        <div id="toolbar-status" class="toolbar-status" role="group" aria-label="Status indicators">
          <label class="toggle-row"><span>Master</span><input type="checkbox" id="toolbar-master" role="switch" checked><span class="switch" aria-hidden="true"></span></label>
          <label class="toggle-row"><span>CPU</span><input type="checkbox" id="toolbar-cpu" role="switch"><span class="switch" aria-hidden="true"></span></label>
          <label class="toggle-row"><span>Battery</span><input type="checkbox" id="toolbar-battery" role="switch"><span class="switch" aria-hidden="true"></span></label>
          <label class="toggle-row"><span>Clock</span><input type="checkbox" id="toolbar-clock" role="switch" checked><span class="switch" aria-hidden="true"></span></label>
        </div>
        <ol id="toolbar-order" class="toolbar-order" aria-label="Toolbar button order"></ol>
        <p id="toolbar-order-status" class="sr-only" role="status" aria-live="polite"></p>
      </section>
    </div>

    <div class="download-panel">
      <strong id="download-summary">1 palette · 4 controls</strong>
      <button id="download" class="download-button" type="button" disabled><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg><span>Download skin</span></button>
    </div>
    <div class="status-row" hidden><p id="status" role="status" aria-live="polite" hidden></p><button id="retry" type="button" class="text-button" hidden>Try again</button></div>
    <noscript><p class="noscript">Enable JavaScript to configure and download a skin.</p></noscript>
  </main>

  <footer>
    <nav aria-label="Project links"><a href="https://github.com/elxrrr/pro-pure-black" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></nav>
    <span>Made with AI</span>
  </footer>
</body>
</html>
